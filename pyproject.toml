[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voicehaul"
version = "0.2.0"
description = "Long-horizon evaluation and failure-onset diagnosis for empathic voice agents"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Vahit Feryad" }]
keywords = ["evaluation", "benchmark", "voice-ai", "speech", "reliability",
            "long-horizon", "empathy", "failure-analysis", "inspect-ai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The core is standard library only. The first thing that stops people
# reproducing your numbers is your dependency list.
dependencies = []

[project.optional-dependencies]
inspect = ["inspect_ai>=0.3.100"]
plot = ["matplotlib>=3.5"]
app = ["streamlit>=1.40", "plotly>=6.0"]
dev = ["inspect_ai>=0.3.100", "matplotlib>=3.5"]

[project.scripts]
voicehaul = "voicehaul.cli:main"

[project.urls]
Homepage = "https://github.com/vahit19/voicehaul"
Demo = "https://huggingface.co/spaces/renderfy/voicehaul"

[tool.setuptools.packages.find]
include = ["voicehaul*"]
